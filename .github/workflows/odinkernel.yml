name: Build Xiaomi MIX4 Kernel (odin)

on:
  workflow_dispatch:
    inputs:
      root_choice:
        description: '选择 Root 方案'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4']

env:
  ROOT_CHOICE: ${{ inputs.root_choice || '1' }}
  TZ: Asia/Shanghai

jobs:
  build-kernel:
    name: Build MIX4 Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ccc62/xiaomi_kernel_odin
          ref: muqianyong
          path: xiaomi_kernel_odin

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install -y git ccache curl wget zip unzip bc python3 openjdk-17-jdk
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('xiaomi_kernel_odin/build.sh') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Run Build Script
        env:
          NON_INTERACTIVE: 1
          ROOT_CHOICE: ${{ env.ROOT_CHOICE }}
        run: |
          cd xiaomi_kernel_odin
          chmod +x build.sh
          ./build.sh -n

      - name: Determine ZIP Name
        id: zipname
        run: |
          cd xiaomi_kernel_odin
          if [ -d ".git" ]; then
            HASH=$(git rev-parse --short=7 HEAD)
            echo "zip_name=MIX4-5.4.289-g${HASH}.zip" >> $GITHUB_OUTPUT
          else
            TIME=$(date '+%Y%m%d%H%M')
            echo "zip_name=MIX4-5.4.289-${TIME}.zip" >> $GITHUB_OUTPUT
          fi

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zipname.outputs.zip_name }}
          path: ${{ github.workspace }}/${{ steps.zipname.outputs.zip_name }}
          if-no-files-found: error

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: ${{ github.workspace }}/kernel.log